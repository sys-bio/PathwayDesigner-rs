<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PathwayDesigner</title>

    <!-- Trunk builds the pd-app crate to wasm and injects the loader script. It
         prefixes every path with `--public-url`, the one place the base path is
         set (SPEC-Rust §14.2). On Windows, build from PowerShell, or from Git Bash
         with MSYS_NO_PATHCONV=1, or Git Bash turns /PathwayDesigner/ into a
         C:/Program Files/Git/... path. -->
    
<script type="module">
import init, * as bindings from './pathway-designer-187583d376a45ae8.js';
const wasm = await init({ module_or_path: './pathway-designer-187583d376a45ae8_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    <!-- Offline use, and the licences of everything the app is built from. -->
    
    
    

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #F8F9FA;
            /* Ctrl/Cmd+A selects everything in the diagram, but the browser
               also runs its own Select All. Had it selected the canvas, a
               press on the canvas would start the browser's drag-and-drop,
               which swallows the mouse moves and the release: a species
               would stay put while dragged, then follow the pointer after
               the button was let go. Nothing on the page is selectable;
               egui's text fields use eframe's own <input> and still work
               (SPEC-Rust §6.4). */
            -webkit-user-select: none;
            user-select: none;
        }
        /* egui sizes itself to fill this canvas. */
        #the_canvas_id {
            display: block;
            -webkit-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
            width: 100%;
            height: 100%;
        }
        /* "A new version is available" (SPEC-Rust §14.2). */
        #update_banner {
            position: fixed;
            right: 16px;
            bottom: 36px;
            display: none;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            background: #FFFFFF;
            border: 1px solid #C8CDD2;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            color: #1A1A1A;
            font: 14px sans-serif;
        }
        #update_banner button {
            font: inherit;
            padding: 3px 10px;
            cursor: pointer;
        }
        #loading_text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #444444;
            font: 18px sans-serif;
        }
    </style>
    <script>
        // The browser's own drag-and-drop must never start over the app
        // (see user-select above): egui handles every drag itself.
        document.addEventListener("dragstart", (e) => e.preventDefault());

        // Offline use (SPEC-Rust §14.2): sw.js caches the app. Relative, so its
        // scope is the base path.
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("sw.js").catch(() => {});
            });
        }

        // A new version: the published page names a different build. Checked a
        // little after loading, every 30 minutes, and on coming back to the tab.
        // GitHub Pages' caching can't be changed, so the page asks for a reload.
        function buildOf(html) {
            const m = /pathway-designer-([0-9a-f]{16})\.js/.exec(html);
            return m ? m[1] : null;
        }
        async function checkForUpdate() {
            const running = buildOf(document.head.innerHTML);
            if (!running) {
                return;
            }
            try {
                const response = await fetch("./", { cache: "no-store" });
                const published = buildOf(await response.text());
                if (published && published !== running) {
                    document.getElementById("update_banner").style.display = "flex";
                }
            } catch (e) {
                // Offline: nothing to compare with.
            }
        }
        window.addEventListener("load", () => {
            setTimeout(checkForUpdate, 10000);
            setInterval(checkForUpdate, 30 * 60 * 1000);
        });
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
                checkForUpdate();
            }
        });
    </script>
<link rel="modulepreload" href="./pathway-designer-187583d376a45ae8.js" crossorigin="anonymous" integrity="sha384-fNSjtQMLQnzlo/RJcHzSLaONWi3sMac0KNnsN+7jCpn61IHHDqPCWh630SOgC+g+"><link rel="preload" href="./pathway-designer-187583d376a45ae8_bg.wasm" crossorigin="anonymous" integrity="sha384-Rze12ukEt6BUscoT0QeollWXKWnV5gjWqWGiohNEtjkZ601w9vCYIBG4lIfT2zew" as="fetch" type="application/wasm"></head>
<body>
    <canvas id="the_canvas_id"></canvas>
    <p id="loading_text">Loading PathwayDesigner…</p>
    <div id="update_banner" role="status">
        <span>A new version of PathwayDesigner is available.</span>
        <button type="button" onclick="location.reload()">Reload</button>
    </div>
</body>
</html>
