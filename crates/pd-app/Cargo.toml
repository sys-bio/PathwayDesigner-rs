[package]
name = "pd-app"
description = "PathwayDesigner: the eframe/egui app for the browser and the desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "pathway-designer"
path = "src/main.rs"

[dependencies]
pd-core.workspace = true
pd-export.workspace = true
eframe.workspace = true
log.workspace = true
web-time = "1"
# File dialogs: native dialogs on the desktop, a file input in the browser.
rfd = "0.17"
# The Gallery's index (S §11.8).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ehttp = "0.7"
# The help window renders Markdown pages.
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Print on the desktop: open the PDF with the system viewer (SPEC-Rust §9).
open = "5"

[target.'cfg(target_os = "macos")'.dependencies]
# The macOS menu bar: the application menu and a Window menu (SPEC-Rust §15.1).
muda = { version = "0.20", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
# Downloads, the File System Access API, the page title, beforeunload and the
# crash page (SPEC-Rust §10.1, §14.4).
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlAnchorElement",
    "HtmlElement",
    "Storage",
    "Url",
    "Window",
] }

# Desktop packages (SPEC-Rust §14.1), made by cargo-packager:
#   cargo packager --release -p pd-app --formats nsis   (Windows installer)
#   cargo packager --release -p pd-app --formats app,dmg (macOS)
#   cargo packager --release -p pd-app --formats deb,appimage (Linux)
# CI builds them on each platform for a version tag (.github/workflows/release.yml).
[package.metadata.packager]
product-name = "PathwayDesigner"
identifier = "org.sys-bio.pathwaydesigner"
description = "A drawing tool for biochemical reaction networks"
long-description = "Draw species and reactions, give them rate laws, lay the network out automatically, and exchange it as Antimony or SBML with layout."
homepage = "https://github.com/sys-bio/PathwayDesigner-rs"
authors = ["Herbert M. Sauro"]
publisher = "sys-bio"
copyright = "Copyright (c) 2026 Herbert M. Sauro"
license-file = "../../LICENSE"
category = "Education"
before-packaging-command = "cargo build --release -p pd-app"
binaries-dir = "../../target/release"
out-dir = "../../target/packages"
binaries = [{ path = "pathway-designer", main = true }]
icons = ["../../assets/icon/icon-32.png", "../../assets/icon/icon-128.png", "../../assets/icon/icon-256.png", "../../assets/icon/icon-512.png", "../../assets/icon/icon.ico"]
resources = ["../../THIRD-PARTY.html"]
