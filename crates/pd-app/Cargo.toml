[package]
name = "pd-app"
description = "PathwayDesigner: the eframe/egui app for the browser and the desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "pathway-designer"
path = "src/main.rs"

[dependencies]
pd-core.workspace = true
pd-export.workspace = true
eframe.workspace = true
log.workspace = true
web-time = "1"
# File dialogs: native dialogs on the desktop, a file input in the browser.
rfd = "0.17"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Print on the desktop: open the PDF with the system viewer (SPEC-Rust §9).
open = "5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
# Downloads, the File System Access API, the page title, beforeunload and the
# crash page (SPEC-Rust §10.1, §14.4).
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlAnchorElement",
    "HtmlElement",
    "Storage",
    "Url",
    "Window",
] }
