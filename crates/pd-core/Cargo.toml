[package]
name = "pd-core"
description = "PathwayDesigner core: geometry, model, file formats, layout and drawing, with no UI or platform code"
version.workspace = true
edition.workspace = true
license.workspace = true

# No egui, no I/O, no platform crates (SPEC-Rust §2, rule 1).
[dependencies]
pd-antimony.workspace = true
sbml-io.workspace = true
# Reads PathwayDesigner's own note in SBML layout annotations (sbml/shape.rs).
roxmltree = "0.21"
harfrust.workspace = true
skrifa.workspace = true
serde = { version = "1", features = ["derive"] }
# float_roundtrip parses every number exactly, so a load and save gives back
# the same digits (SPEC-Rust §4.1). preserve_order keeps key order in
# serde_json::Value, which the tests use to check the written layout.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
