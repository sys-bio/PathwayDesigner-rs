[package]
name = "pd-export"
description = "PathwayDesigner graphics export: SVG to PNG (resvg) and PDF (svg2pdf). No egui."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pd-core.workspace = true
# Without default features: no system fonts, text shaping or raster images.
# Labels reach resvg as outlines (SPEC-Rust §9), so it never needs a font.
resvg = { version = "0.48.1", default-features = false }
