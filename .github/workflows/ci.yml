# CI and deployment (SPEC-Rust §14.5).
# Every push: format, lints, licences, native tests, wasm32 check; and
# sbml-io checked against python-libsbml; PDF output checked with pypdfium2;
# the production build checked in headless Chromium; the desktop app on macOS.
# On main: build the web app with Trunk and publish it to GitHub Pages.
# One-time setup on GitHub: Settings → Pages → Source: "GitHub Actions".
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A new push to a branch cancels that branch's older runs, checks included, so
# only the newest commit ever deploys. (Cancelling only the Pages jobs would
# let an older commit whose checks finished late overwrite a newer one.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TRUNK_VERSION: v0.21.14
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with clippy, rustfmt and the WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy, native (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy, wasm32 (every crate must build for the browser)
        run: cargo clippy --workspace --target wasm32-unknown-unknown -- -D warnings

      - name: Licences and advisories
        uses: EmbarkStudios/cargo-deny-action@v2

      # The licences page the app ships must match the dependencies (§8.5).
      - name: THIRD-PARTY.html is up to date
        run: python3 scripts/third_party.py --check

      # Native tests keep the desktop version possible (SPEC-Rust §14.5).
      - name: Tests
        run: cargo test --workspace

  # The desktop app on macOS (SPEC-Rust §15.1): the menu bar code only builds
  # there, so lint and test it on a Mac runner too.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (warnings are errors)
        run: cargo clippy -p pd-app --all-targets -- -D warnings

      - name: Tests
        run: cargo test -p pd-app

  # sbml-io against python-libsbml: every Level 2 and Level 3 model of the SBML
  # Test Suite, and the Layout files in crates/sbml-io/tests/data, are read and
  # written back by sbml-io; libsbml must find each rewrite identical to the
  # original, and no less valid.
  sbml:
    runs-on: ubuntu-latest
    env:
      SBML_TEST_SUITE: "3.5.0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python-libsbml
        run: pip install python-libsbml

      - name: Fetch the SBML Test Suite (Level 1 is out of scope)
        run: |
          curl -sSL -o semantic.zip \
            "https://github.com/sbmlteam/sbml-test-suite/releases/download/${SBML_TEST_SUITE}/semantic_tests_v${SBML_TEST_SUITE}.zip"
          unzip -q semantic.zip -d suite
          find suite -name '*-l1v*.xml' -delete

      - name: Round trip the Test Suite
        run: |
          cargo run -q -p sbml-io --release --example roundtrip -- suite rewritten > roundtrip.txt || { grep -v '^$' roundtrip.txt | tail -40; exit 1; }
          tail -1 roundtrip.txt
          python crates/sbml-io/tests/scripts/libsbml_compare.py suite rewritten

      - name: Round trip the Layout files
        run: |
          cargo run -q -p sbml-io --release --example roundtrip -- crates/sbml-io/tests/data rewritten-layout
          python crates/sbml-io/tests/scripts/libsbml_compare.py crates/sbml-io/tests/data rewritten-layout

      # SPEC-Rust §8.3: every Models/*.json exported as SBML passes libsbml's
      # checkConsistency() with no errors.
      - name: Export the models as SBML and check them
        run: |
          cargo run -q -p pd-core --release --example export_sbml -- exported
          python crates/pd-core/tests/scripts/check_sbml.py exported

  # SPEC-Rust §9: every Models/*.json as PDF opens in pypdf with the right
  # page, and pypdfium2 (Chrome's PDF engine) draws it the same as resvg
  # draws the PNG.
  graphics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the PDF tools
        run: pip install pypdf pypdfium2 pillow numpy

      - name: Export the models and compare PDF with PNG
        run: |
          cargo run -q -p pd-export --release --example export_models -- exported
          python crates/pd-export/tests/scripts/compare_pdf.py exported

  # The production build in a real browser (SPEC-Rust §12, §14.2): served from
  # the sub-path, it starts without errors, the service worker takes over and
  # the app starts offline, and the new-version banner works.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with the WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install Trunk (prebuilt)
        run: |
          curl -sSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"             | tar -xz -C /usr/local/bin trunk

      # Relative paths, as published: the files work from any folder.
      - name: Build
        run: trunk build --release --public-url ./

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright with Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Browser checks
        run: python crates/pd-app/tests/web_smoke.py dist

  pages:
    needs: [check, web]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with the WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install Trunk (prebuilt)
        run: |
          curl -sSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin trunk
          trunk --version

      # Relative paths, so the same files work at https://<owner>.github.io/<repo>/
      # and from any folder of anyone else's server (SPEC-Rust §14.2).
      - name: Build
        run: trunk build --release --public-url ./

      # The gh-pages branch is the website, ready to copy, as for MakeSBML: one
      # commit, replaced on every deployment, so old builds don't pile up.
      - name: Publish the site to the gh-pages branch
        working-directory: dist
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Website built from ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          rm -rf .git

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
