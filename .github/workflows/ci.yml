# CI and deployment (SPEC-Rust §14.5).
# Every push: format, lints, licences, native tests, wasm32 check.
# On main: build the web app with Trunk and publish it to GitHub Pages.
# One-time setup on GitHub: Settings → Pages → Source: "GitHub Actions".
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A new push to a branch cancels that branch's older runs, checks included, so
# only the newest commit ever deploys. (Cancelling only the Pages jobs would
# let an older commit whose checks finished late overwrite a newer one.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TRUNK_VERSION: v0.21.14
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with clippy, rustfmt and the WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy, native (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy, wasm32 (every crate must build for the browser)
        run: cargo clippy --workspace --target wasm32-unknown-unknown -- -D warnings

      - name: Licences and advisories
        uses: EmbarkStudios/cargo-deny-action@v2

      # Native tests keep the desktop version possible (SPEC-Rust §14.5).
      - name: Tests
        run: cargo test --workspace

  pages:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with the WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install Trunk (prebuilt)
        run: |
          curl -sSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin trunk
          trunk --version

      # Pages serves the site at https://<owner>.github.io/<repo>/, so every path
      # must start with /<repo>/. The base path is set here and nowhere else.
      - name: Build
        run: trunk build --release --public-url "/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
