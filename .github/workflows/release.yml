# Desktop packages (SPEC-Rust §14.1, §15.1).
# Pushing a version tag (v0.1.0, …) builds the packages on each platform's
# runner and attaches them to a draft GitHub release, to check and publish by
# hand. Run it from the Actions tab (workflow_dispatch) to get the packages as
# build artifacts without a release.
#
# The packages are not signed (a decision, SPEC-Rust §14.1): Windows
# SmartScreen and macOS Gatekeeper warn on first start.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: nsis
          - os: macos-latest
            formats: app,dmg
          - os: ubuntu-latest
            formats: deb,appimage
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      # AppImage tools run as AppImages themselves, which need FUSE 2.
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Build the packages
        run: cargo packager --release -p pd-app --formats ${{ matrix.formats }}

      - name: Collect them
        shell: bash
        run: |
          mkdir dist-packages
          find target/packages -maxdepth 1 -type f -exec cp {} dist-packages/ \;
          # A .app is a folder: zip it.
          if [ -d target/packages/PathwayDesigner.app ]; then
            (cd target/packages && zip -qry ../../dist-packages/PathwayDesigner-macos.app.zip PathwayDesigner.app)
          fi
          ls -la dist-packages

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: dist-packages/*

      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist-packages/*

  # The web app as a zip, to put on any web server (SPEC-Rust §14.2).
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with the WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install Trunk (prebuilt)
        run: |
          curl -sSL "https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin trunk

      - name: Build and zip
        run: |
          trunk build --release --public-url ./
          VERSION="${GITHUB_REF_NAME}"
          (cd dist && zip -qr "../PathwayDesigner-web-${VERSION}.zip" .)
          ls -la PathwayDesigner-web-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: PathwayDesigner-web-*.zip

      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: PathwayDesigner-web-*.zip
