# cargo deny check (SPEC-Rust §8.5): every dependency must have a licence
# compatible with the project's MIT licence.

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "OFL-1.1",
    # Data, not code: the root certificates in webpki-roots, which the
    # Gallery's downloads use on the desktop (S §11.8).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# The list is a policy, not an inventory: licences nobody uses yet are fine.
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
# Unmaintained, not vulnerable: zvariant, zvariant_derive and zbus_names were
# merged into zbus 6. They come in only through eframe's Linux screen-reader
# support (accesskit_unix -> atspi -> zbus 5). Remove these when eframe moves
# to an accesskit that uses zbus 6.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; only via eframe's accesskit_unix" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; only via eframe's accesskit_unix" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; only via eframe's accesskit_unix" },
]
