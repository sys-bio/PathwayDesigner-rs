[workspace]
resolver = "3"
members = [
    "crates/antimony",
    "crates/pd-core",
    "crates/pd-export",
    "crates/pd-app",
    "crates/sbml-io",
]

[workspace.package]
version = "0.1.16"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# The Antimony crate's package is `antimony-rs`; its library is `antimony`.
antimony-rs = { path = "crates/antimony" }
pd-core = { path = "crates/pd-core" }
pd-export = { path = "crates/pd-export" }
sbml-io = { path = "crates/sbml-io" }
# eframe's defaults minus `default_fonts`: the app uses only the bundled font
# (SPEC-Rust §5.4), and egui's own fonts include one under the Ubuntu Font Licence.
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "links",
    # Preferences saved between sessions (localStorage on the web, S §12).
    "persistence",
    "wayland",
    "web_screen_reader",
    "wgpu",
    "x11",
] }
# Text shaping and font metrics. These are the versions egui 0.36 uses, so the
# app ships one copy of each and pd-core measures text exactly the way egui
# lays it out (SPEC-Rust §5.4).
harfrust = "0.12"
skrifa = "0.44"
log = "0.4"

[profile.release]
lto = true
codegen-units = 1
